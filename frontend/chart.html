<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Chart & Paper Trades | AlgoSaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBase: '#0f172a',
                        darkCard: '#1e293b',
                        primary: '#3b82f6',
                        success: '#10b981',
                        danger: '#ef4444'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; overflow: hidden; }
        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        
        /* Chart container height adjustments for mobile */
        #tv_chart_container { height: calc(100vh - 280px); width: 100%; }
        #positions_panel { height: 220px; overflow-y: auto; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <header class="bg-darkCard border-b border-slate-700 p-3 flex items-center justify-between shadow-md z-10">
        <div class="flex items-center gap-3">
            <button onclick="window.location.href='index.html'" class="bg-slate-800 text-slate-300 w-8 h-8 rounded-full flex items-center justify-center border border-slate-600 hover:bg-slate-700 transition font-bold">&larr;</button>
            <div class="flex flex-col">
                <h2 class="text-sm font-bold text-white flex items-center gap-2">
                    📈 Live Terminal
                    <span id="mode-badge" class="px-2 py-0.5 text-[8px] bg-orange-500 text-white rounded font-black tracking-wider uppercase shadow-[0_0_8px_rgba(249,115,22,0.5)]">PAPER</span>
                </h2>
                <select id="chart-index" onchange="changeChart()" class="bg-transparent text-xs text-slate-400 font-bold outline-none cursor-pointer mt-0.5">
                    <option value="BSE:NIFTY">NIFTY 50</option>
                    <option value="BSE:SENSEX">SENSEX</option>
                    <option value="BSE:BANKNIFTY">BANKNIFTY</option>
                </select>
            </div>
        </div>
        
        <div class="text-right bg-slate-900 border border-slate-700 px-3 py-1 rounded-lg shadow-inner">
            <p class="text-[9px] text-slate-500 font-bold uppercase tracking-wider mb-0.5">Total MTM</p>
            <p id="total-pnl" class="text-lg font-black text-slate-300 transition-colors">+ ₹0.00</p>
        </div>
    </header>

    <main class="w-full relative bg-[#131722] border-b border-slate-700" id="tv_chart_container">
        </main>

    <section id="positions_panel" class="bg-darkBase p-2">
        <div class="flex justify-between items-center mb-2 px-1">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                💼 Open Positions
                <span class="w-2 h-2 bg-success rounded-full shadow-[0_0_5px_#10b981] animate-pulse"></span>
            </h3>
            <button onclick="fetchPaperTrades()" class="text-xs text-primary hover:text-white transition">&#x21bb; Refresh</button>
        </div>

        <div id="trades-container" class="space-y-2 pb-6">
            <div class="text-center text-xs text-slate-500 py-4" id="loading-msg">Fetching live trades...</div>
            
            </div>
    </section>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        const API_BASE_URL = "https://algosaas.onrender.com/api/v1";
        const WS_BASE_URL = "wss://algosaas.onrender.com/ws/live-data";
        let tvWidget = null;
        let wsConnection = null;

        window.onload = () => {
            // Check Mode
            const mode = localStorage.getItem('trade_mode') || 'PAPER';
            const badge = document.getElementById('mode-badge');
            if(mode === 'REAL') {
                badge.innerText = 'REAL';
                badge.className = "px-2 py-0.5 text-[8px] bg-success text-white rounded font-black tracking-wider uppercase shadow-[0_0_8px_rgba(16,185,129,0.5)]";
            }
            
            // Initialize Chart
            initChart("BSE:NIFTY");
            
            // Start pulling paper trades data
            fetchPaperTrades();
            
            // Connect WebSocket for Live P&L Updates
            connectWebSocket();
        };

        // --- TRADINGVIEW INITIALIZATION ---
        function initChart(symbol) {
            tvWidget = new TradingView.widget({
                "autosize": true,
                "symbol": symbol,
                "interval": "5",       // 5 Min timeframe default
                "timezone": "Asia/Kolkata",
                "theme": "dark",
                "style": "1",          // Candles
                "locale": "in",
                "enable_publishing": false,
                "backgroundColor": "#131722",
                "gridColor": "#1f2937",
                "hide_top_toolbar": false,
                "hide_legend": false,
                "save_image": false,
                "container_id": "tv_chart_container",
                "studies": [
                    "Volume@tv-basicstudies"
                ],
                "disabled_features": [
                    "header_symbol_search",
                    "header_compare"
                ]
            });
        }

        function changeChart() {
            const sym = document.getElementById('chart-index').value;
            initChart(sym);
        }

        // --- FETCH TRADES FROM BACKEND ---
        async function fetchPaperTrades() {
            // Hum backend me ek nayi API banayenge jo open paper trades bhejegi
            const container = document.getElementById('trades-container');
            const token = localStorage.getItem('saas_token');
            if(!token) return;

            try {
                // TODO: Backend route for fetching trades
                const response = await fetch(`${API_BASE_URL}/trades/open-positions?mode=${localStorage.getItem('trade_mode') || 'PAPER'}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if(response.ok) {
                    const data = await response.json();
                    renderTrades(data.positions);
                } else {
                    container.innerHTML = `<div class="text-center text-xs text-slate-500 py-4">No active positions</div>`;
                }
            } catch(e) {
                container.innerHTML = `<div class="text-center text-xs text-danger py-4">Failed to load trades.</div>`;
            }
        }

        function renderTrades(positions) {
            const container = document.getElementById('trades-container');
            if(!positions || positions.length === 0) {
                container.innerHTML = `<div class="text-center text-xs text-slate-500 py-4">No active positions</div>`;
                document.getElementById('total-pnl').innerText = '₹0.00';
                document.getElementById('total-pnl').className = 'text-lg font-black text-slate-300';
                return;
            }

            container.innerHTML = '';
            let totalMtm = 0;

            positions.forEach(pos => {
                // UI Logic based on live P&L
                const pnl = pos.mtm || 0;
                totalMtm += pnl;
                const pnlColor = pnl >= 0 ? 'text-success' : 'text-danger';
                const pnlSign = pnl >= 0 ? '+' : '';
                const posColor = pos.transaction === 'B' ? 'bg-success' : 'bg-danger';
                const posText = pos.transaction === 'B' ? 'BUY' : 'SELL';

                const html = `
                <div class="bg-darkCard border border-slate-700/50 hover:border-slate-500 transition-colors rounded-lg p-3 flex justify-between items-center shadow-md">
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-[10px] font-bold ${posColor} text-white px-1.5 py-0.5 rounded">${posText}</span>
                            <span class="text-xs font-bold text-white">${pos.symbol}</span>
                            <span class="text-[10px] text-slate-400">x ${pos.qty}</span>
                        </div>
                        <div class="text-[10px] text-slate-400">
                            Avg: <span class="text-white">₹${(pos.entry_price || 0).toFixed(2)}</span> | 
                            LTP: <span class="${pnlColor} font-bold">₹${(pos.ltp || 0).toFixed(2)}</span>
                        </div>
                    </div>
                    <div class="text-right flex flex-col items-end">
                        <span class="text-sm font-black ${pnlColor}">${pnlSign} ₹${Math.abs(pnl).toFixed(2)}</span>
                        <button onclick="squareOff('${pos.id}')" class="mt-1 text-[9px] bg-slate-800 text-slate-300 border border-slate-600 px-2 py-1 rounded hover:bg-danger hover:text-white hover:border-danger transition">SQUARE OFF</button>
                    </div>
                </div>`;
                container.innerHTML += html;
            });

            // Update Total Header
            const totalEl = document.getElementById('total-pnl');
            totalEl.innerText = `${totalMtm >= 0 ? '+' : ''} ₹${Math.abs(totalMtm).toFixed(2)}`;
            totalEl.className = `text-lg font-black transition-colors drop-shadow-md ${totalMtm >= 0 ? 'text-success' : 'text-danger'}`;
        }

        // --- WEBSOCKET FOR LIVE TICK UPDATES ---
        function connectWebSocket() {
            const token = localStorage.getItem('saas_token');
            if(!token) return;

            wsConnection = new WebSocket(`${WS_BASE_URL}?token=${token}&mode=${localStorage.getItem('trade_mode') || 'PAPER'}`);
            
            wsConnection.onmessage = (event) => {
                const data = JSON.parse(event.data);
                // Agar WebSocket humein positions array aur total_pnl de
                if(data.positions) {
                    renderTrades(data.positions);
                }
            };

            wsConnection.onclose = () => {
                setTimeout(connectWebSocket, 5000); 
            };
        }

        // --- SQUARE OFF FUNCTION ---
        async function squareOff(tradeId) {
            if(confirm("Square off this position at Market Price?")) {
                const token = localStorage.getItem('saas_token');
                try {
                    // Backend route trigger hoga (abhi banayenge)
                    const res = await fetch(`${API_BASE_URL}/trades/close-position`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ trade_id: tradeId, mode: localStorage.getItem('trade_mode') || 'PAPER' })
                    });
                    if(res.ok) {
                        alert("Position Closed!");
                        fetchPaperTrades(); // Refresh list
                    }
                } catch(e) {
                    alert("Failed to close position.");
                }
            }
        }
    </script>
</body>
</html>
