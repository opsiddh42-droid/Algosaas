<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AlgoSaaS Pro | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { primary: '#3b82f6', success: '#10b981', danger: '#f43f5e' }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #020617; color: #f8fafc; 
            background-image: radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%), radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .hidden { display: none !important; }
        .glass-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1); }
        .modal-overlay { background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 100;}
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #fff; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col relative selection:bg-primary/30">

    <div id="auth-section" class="flex-1 flex items-center justify-center p-4 relative z-10">
        <div class="glass-card w-full max-w-md p-8 rounded-3xl transition-all duration-500 relative overflow-hidden">
            <div class="text-center mb-8 relative z-10">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 mb-4 shadow-lg"><span class="text-2xl">⚡</span></div>
                <h1 class="text-3xl font-extrabold text-white tracking-tight">AlgoSaaS</h1>
                <p class="text-slate-400 mt-1 font-medium text-sm">Login to Dashboard</p>
            </div>
            
            <form id="login-form" onsubmit="handleLogin(event)" class="relative z-10">
                <div class="mb-5">
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Email Address</label>
                    <input type="email" id="login-email" required class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-primary outline-none" placeholder="trader@algosaas.com">
                </div>
                <div class="mb-6">
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Password</label>
                    <input type="password" id="login-password" required class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-primary outline-none" placeholder="••••••••">
                </div>
                <button type="submit" id="login-btn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold py-3.5 rounded-xl shadow-lg">Secure Login</button>
                <div id="login-error" class="text-danger text-sm text-center mt-4 hidden"></div>
            </form>
        </div>
    </div>

    <div id="dashboard-section" class="hidden flex-1 flex flex-col z-10">
        <header class="glass-card border-b-0 p-4 sticky top-0 z-50 rounded-b-3xl mx-2 mt-2">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center"><span class="text-lg">⚡</span></div>
                    <div>
                        <h2 class="text-xl font-extrabold text-white">AlgoSaaS</h2>
                        <p class="text-xs text-blue-400 font-semibold" id="welcome-msg">Welcome</p>
                    </div>
                </div>
                <div class="flex flex-col items-end gap-2">
                    <button onclick="logout()" class="text-xs bg-red-500/10 text-rose-400 border border-rose-500/30 px-3 py-1.5 rounded-lg font-bold">Logout</button>
                </div>
            </div>
        </header>

        <main class="p-4 flex-1 max-w-lg mx-auto w-full">
            
            <!-- ALGO BOT CARD -->
            <div class="glass-card rounded-2xl p-5 mb-6 border border-emerald-500/20 relative overflow-hidden">
                <div class="absolute -left-6 -bottom-6 w-32 h-32 bg-emerald-500/10 rounded-full blur-2xl"></div>
                <div class="flex justify-between items-start mb-4 relative z-10">
                    <div>
                        <h3 class="font-bold text-lg text-white flex items-center gap-2">
                            🤖 Smart Algo Bot 
                            <button onclick="openAlgoSettings()" class="text-slate-400 hover:text-white transition" title="Strategy Settings">⚙️</button>
                        </h3>
                        <p id="algo-plan" class="text-xs text-emerald-400 font-bold mt-1">Loading Plan...</p>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="algo-toggle" class="sr-only peer" onchange="toggleAlgo()">
                        <div class="w-14 h-7 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-emerald-500"></div>
                    </label>
                </div>
                <div class="bg-slate-900/60 rounded-xl p-3 border border-slate-800 relative z-10 flex justify-between items-center">
                    <div>
                        <p class="text-[10px] text-slate-400 uppercase font-bold">Status</p>
                        <p id="algo-status-text" class="text-sm font-black text-slate-300 mt-0.5">⚪ Offline</p>
                    </div>
                </div>
                <button onclick="testAlgoExecution()" id="test-algo-btn" class="w-full mt-4 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl text-xs font-bold transition border border-slate-600/50 relative z-10 hidden">
                    ⚙️ Force Execute Now (Manual Test)
                </button>
            </div>

            <!-- MARKET DATA -->
            <div class="glass-card rounded-2xl p-5 mb-6 border border-blue-500/20 relative">
                <h3 class="font-bold text-lg text-white mb-1">📊 Market Data Sync</h3>
                <p class="text-xs text-slate-400 mb-4">Fetch latest weekly expiry strikes.</p>
                <button onclick="updateWeeklyExpiry()" id="sync-btn" class="w-full bg-slate-800/80 hover:bg-slate-700 text-white font-bold py-3.5 rounded-xl border border-slate-600/50 transition-all">
                    <span id="btn-text">🔄 Update Weekly Expiry</span>
                </button>
            </div>
            
            <button onclick="window.location.href='optionchain.html'" class="w-full glass-card p-5 rounded-2xl text-center hover:border-blue-500/50 transition-all duration-300 mb-4 border border-slate-700/50 flex justify-center items-center gap-3">
                <div class="text-3xl">⛓️</div>
                <div class="text-xl font-extrabold text-white">Open Option Chain</div>
            </button>
            
        </main>
    </div>

    <!-- 🟢 ALGO SETTINGS MODAL 🟢 -->
    <div id="algo-settings-modal" class="hidden fixed inset-0 modal-overlay flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-sm rounded-3xl border border-slate-700 p-6 shadow-2xl animate-[slideUp_0.2s_ease-out]">
            <div class="flex justify-between items-center mb-5">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">⚙️ Strategy Settings</h3>
                <button onclick="closeAlgoSettings()" class="text-slate-400 hover:text-white bg-slate-800 rounded-full w-8 h-8 flex items-center justify-center font-bold text-xl">&times;</button>
            </div>

            <div class="bg-slate-900/60 border border-slate-700 rounded-xl p-4 mb-5">
                <label class="flex items-center justify-between cursor-pointer">
                    <span class="text-sm font-bold text-white">Use Default Strategy</span>
                    <input type="checkbox" id="cfg-default" class="sr-only peer" onchange="toggleCustomSettings()">
                    <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary relative"></div>
                </label>
                <p class="text-[10px] text-slate-400 mt-2 leading-relaxed">Mon/Fri: Nifty ₹6 | Tue: Sensex ₹12. Auto executes at 10:00 AM with 200% SL.</p>
            </div>

            <div id="custom-settings-div" class="space-y-4 transition-all">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1.5">Select Index</label>
                    <select id="cfg-index" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:border-primary outline-none">
                        <option value="NIFTY">NIFTY 50</option>
                        <option value="BANKNIFTY">BANKNIFTY</option>
                        <option value="SENSEX">SENSEX</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1.5">Max Premium (₹)</label>
                        <input type="number" id="cfg-premium" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:border-primary outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1.5">Stoploss (%)</label>
                        <input type="number" id="cfg-sl" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:border-danger outline-none" placeholder="e.g. 200">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1.5">Entry Time</label>
                    <input type="time" id="cfg-time" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:border-primary outline-none">
                </div>
            </div>

            <button onclick="saveAlgoConfig()" class="w-full mt-6 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg hover:shadow-blue-500/30">
                Save Settings
            </button>
        </div>
    </div>

    <script>
        const API_BASE_URL = "https://algosaas.onrender.com/api/v1"; 

        window.onload = () => {
            const token = localStorage.getItem('saas_token');
            if(token) {
                showDashboard(localStorage.getItem('saas_user'), localStorage.getItem('saas_kotak'));
                fetchAlgoStatus();
            }
        };

        // --- AUTH & LOGIN LOGIC ---
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            btn.innerHTML = '<span class="loader"></span>';
            try {
                const res = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('login-email').value, password: document.getElementById('login-password').value })
                });
                const data = await res.json();
                if(res.ok) {
                    localStorage.setItem('saas_token', data.access_token);
                    localStorage.setItem('saas_user', data.user_name || "Trader");
                    showDashboard(data.user_name, data.kotak_status);
                    fetchAlgoStatus();
                } else alert("Login Failed!");
            } catch (err) { alert("Network Error"); }
            btn.innerHTML = 'Secure Login';
        }

        function showDashboard(userName, kotakStatus) {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('welcome-msg').innerText = `Welcome, ${userName}`;
        }

        function logout() { localStorage.clear(); location.reload(); }

        // --- ALGO BOT & SETTINGS LOGIC ---
        async function fetchAlgoStatus() {
            const token = localStorage.getItem('saas_token');
            if(!token) return;
            const res = await fetch(`${API_BASE_URL}/algo/status`, { headers: { 'Authorization': `Bearer ${token}` }});
            const data = await res.json();
            if(res.ok) {
                document.getElementById('algo-toggle').checked = data.is_active;
                document.getElementById('algo-plan').innerText = `Plan: ${data.plan_today}`;
                
                const statusText = document.getElementById('algo-status-text');
                if(data.is_active) {
                    statusText.innerHTML = data.executed_today ? "🟢 Trades Running" : "🟡 Active (Waiting for Time)";
                    document.getElementById('test-algo-btn').classList.remove('hidden');
                } else {
                    statusText.innerHTML = "⚪ Offline";
                    document.getElementById('test-algo-btn').classList.add('hidden');
                }

                // Populate Settings Form
                const cfg = data.config;
                document.getElementById('cfg-default').checked = cfg.use_default;
                document.getElementById('cfg-index').value = cfg.index;
                document.getElementById('cfg-premium').value = cfg.max_premium;
                document.getElementById('cfg-sl').value = cfg.sl_pct;
                document.getElementById('cfg-time').value = cfg.entry_time;
                toggleCustomSettings();
            }
        }

        async function toggleAlgo() {
            const token = localStorage.getItem('saas_token');
            const res = await fetch(`${API_BASE_URL}/algo/toggle`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` }});
            if(res.ok) fetchAlgoStatus();
        }

        function openAlgoSettings() { document.getElementById('algo-settings-modal').classList.remove('hidden'); }
        function closeAlgoSettings() { document.getElementById('algo-settings-modal').classList.add('hidden'); }

        function toggleCustomSettings() {
            const isDefault = document.getElementById('cfg-default').checked;
            const customDiv = document.getElementById('custom-settings-div');
            if(isDefault) {
                customDiv.style.opacity = '0.4';
                customDiv.style.pointerEvents = 'none';
            } else {
                customDiv.style.opacity = '1';
                customDiv.style.pointerEvents = 'auto';
            }
        }

        async function saveAlgoConfig() {
            const token = localStorage.getItem('saas_token');
            const payload = {
                use_default: document.getElementById('cfg-default').checked,
                index: document.getElementById('cfg-index').value,
                max_premium: parseFloat(document.getElementById('cfg-premium').value || 6),
                sl_pct: parseFloat(document.getElementById('cfg-sl').value || 200),
                entry_time: document.getElementById('cfg-time').value || "10:00"
            };

            const res = await fetch(`${API_BASE_URL}/algo/config`, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if(res.ok) {
                alert("✅ " + data.message);
                closeAlgoSettings();
                fetchAlgoStatus();
            } else alert("❌ Error saving settings");
        }

        async function testAlgoExecution() {
            const btn = document.getElementById('test-algo-btn');
            btn.innerText = "⏳ Executing...";
            const res = await fetch(`${API_BASE_URL}/algo/execute-now?mode=${localStorage.getItem('trade_mode') || 'PAPER'}`, { method: 'POST', headers: { 'Authorization': `Bearer ${localStorage.getItem('saas_token')}` }});
            const data = await res.json();
            alert(res.ok ? "✅ " + data.message : "❌ " + (data.message || data.detail));
            fetchAlgoStatus();
            btn.innerText = "⚙️ Force Execute Now (Manual Test)";
        }

        // --- SYNC LOGIC ---
        async function updateWeeklyExpiry() {
            if(!confirm("Sync latest Weekly Expiry data from Exchange?")) return;
            const btn = document.getElementById('sync-btn');
            btn.innerHTML = "⏳ Syncing...";
            const res = await fetch(`${API_BASE_URL}/market/sync-master`, { method: 'POST', headers: { 'Authorization': `Bearer ${localStorage.getItem('saas_token')}` }});
            const data = await res.json();
            alert(res.ok ? "✅ " + data.message : "❌ Error syncing");
            btn.innerHTML = "🔄 Update Weekly Expiry";
        }
    </script>
</body>
</html>
