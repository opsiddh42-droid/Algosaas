<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AlgoSaaS Pro | Premium Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        darkBase: '#020617', 
                        darkCard: 'rgba(30, 41, 59, 0.7)', 
                        primary: '#3b82f6',
                        success: '#10b981',
                        danger: '#f43f5e' 
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #020617; 
            color: #f8fafc; 
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .hidden { display: none !important; }
        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .panel-area { height: calc(100vh - 180px); overflow-y: auto; padding-bottom: 20px;}
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #fff; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col relative selection:bg-primary/30">

    <!-- AUTH SECTION -->
    <div id="auth-section" class="flex-1 flex items-center justify-center p-4 relative z-10">
        <div class="glass-card w-full max-w-md p-8 rounded-3xl transition-all relative overflow-hidden">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 mb-4 shadow-lg"><span class="text-2xl">⚡</span></div>
                <h1 class="text-3xl font-extrabold text-white">AlgoSaaS</h1>
                <p id="auth-subtitle" class="text-slate-400 mt-1 text-sm">Login to your terminal</p>
            </div>
            
            <!-- LOGIN FORM -->
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="mb-5">
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Email Address</label>
                    <input type="email" id="login-email" required class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3.5 text-white outline-none focus:border-primary" placeholder="trader@algosaas.com">
                </div>
                <div class="mb-6">
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Password</label>
                    <input type="password" id="login-password" required class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3.5 text-white outline-none focus:border-primary" placeholder="••••••••">
                </div>
                <button type="submit" id="login-btn" class="w-full bg-primary text-white font-bold py-3.5 rounded-xl shadow-lg flex justify-center items-center">Secure Login</button>
                <button type="button" onclick="toggleAuthMode('signup')" class="w-full mt-4 text-xs text-slate-400">New here? <span class="text-primary font-bold">Sign Up</span></button>
            </form>

            <!-- SIGNUP FORM -->
            <form id="signup-form" onsubmit="handleSignup(event)" class="hidden">
                <div class="mb-4">
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Full Name</label>
                    <input type="text" id="signup-name" required class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white outline-none focus:border-success" placeholder="John Doe">
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Email Address</label>
                    <input type="email" id="signup-email" required class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white outline-none focus:border-success" placeholder="trader@algosaas.com">
                </div>
                <div class="mb-6">
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Password</label>
                    <input type="password" id="signup-password" required class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white outline-none focus:border-success" placeholder="••••••••">
                </div>
                <button type="submit" id="signup-btn" class="w-full bg-success text-white font-bold py-3.5 rounded-xl shadow-lg flex justify-center items-center">Create Account</button>
                <button type="button" onclick="toggleAuthMode('login')" class="w-full mt-4 text-xs text-slate-400">Back to <span class="text-primary font-bold">Login</span></button>
            </form>
        </div>
    </div>

    <!-- DASHBOARD SECTION -->
    <div id="dashboard-section" class="hidden flex-1 flex flex-col p-4">
        <div class="glass-card p-6 rounded-3xl text-center">
            <h2 class="text-2xl font-bold mb-2" id="welcome-msg">Welcome!</h2>
            <p class="text-slate-400 mb-6">You are now logged into the terminal.</p>
            <button onclick="logout()" class="bg-danger px-6 py-2 rounded-xl font-bold">Logout</button>
        </div>
    </div>

    <script>
        const API_BASE_URL = "http://3.238.133.122:8000/api/v1";

        function toggleAuthMode(mode) {
            document.getElementById('login-form').classList.toggle('hidden', mode === 'signup');
            document.getElementById('signup-form').classList.toggle('hidden', mode === 'login');
            document.getElementById('auth-subtitle').innerText = mode === 'signup' ? "Create Admin Account" : "Login to Terminal";
        }

        async function handleSignup(e) {
            e.preventDefault();
            const btn = document.getElementById('signup-btn');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<span class="loader"></span>';
            
            const payload = {
                name: document.getElementById('signup-name').value,
                email: document.getElementById('signup-email').value,
                password: document.getElementById('signup-password').value
            };

            try {
                // FIXED ENDPOINT: screenshot ke hisaab se /auth/signup hai
                const res = await fetch(`${API_BASE_URL}/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (res.ok) {
                    alert("✅ Account Created Successfully! Now Login.");
                    toggleAuthMode('login');
                } else {
                    const errorData = await res.json();
                    alert("❌ Signup Failed: " + (errorData.detail || "Error"));
                }
            } catch (err) { 
                alert("Network Error. Backend port 8000 band ho sakta hai."); 
            }
            btn.innerHTML = originalHTML;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<span class="loader"></span>';
            
            try {
                // FIXED ENDPOINT: screenshot ke hisaab se /auth/login hai
                const res = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('login-email').value,
                        password: document.getElementById('login-password').value
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('saas_token', data.access_token);
                    document.getElementById('auth-section').classList.add('hidden');
                    document.getElementById('dashboard-section').classList.remove('hidden');
                    document.getElementById('welcome-msg').innerText = "Welcome, " + (data.user_name || "Trader");
                } else {
                    alert("❌ Login Failed: " + (data.detail || "Invalid Credentials"));
                }
            } catch (err) { 
                alert("Network Error. Backend check kijiye."); 
            }
            btn.innerHTML = originalHTML;
        }

        function logout() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
