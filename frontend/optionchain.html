<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Option Chain | AlgoSaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBase: '#0f172a',
                        darkCard: '#1e293b',
                        primary: '#3b82f6',
                        success: '#10b981',
                        danger: '#ef4444',
                        atmBg: '#334155'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .hidden { display: none !important; }
        /* Chhota loader mobile ke liye */
        .spinner { border: 2px solid #1e293b; border-top: 2px solid #3b82f6; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* Scrollbar hide for clean mobile look */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-darkCard border-b border-slate-700 p-3 sticky top-0 z-50 flex items-center justify-between shadow-md">
        <div class="flex items-center gap-3">
            <button onclick="window.location.href='index.html'" class="bg-slate-800 text-slate-300 w-8 h-8 rounded-full flex items-center justify-center border border-slate-600 hover:bg-slate-700 transition">
                &larr;
            </button>
            <h2 class="text-lg font-bold text-white flex items-center gap-2">
                ⛓️ Option Chain 
                <span id="live-indicator" class="w-2 h-2 bg-success rounded-full shadow-[0_0_5px_#10b981] hidden"></span>
            </h2>
        </div>
        
        <select id="index-select" onchange="fetchOptionChain()" class="bg-slate-800 border border-slate-600 rounded px-2 py-1.5 text-xs text-white focus:border-primary outline-none font-bold">
            <option value="NIFTY">NIFTY</option>
            <option value="BANKNIFTY">BANKNIFTY</option>
            <option value="SENSEX">SENSEX</option>
        </select>
    </header>

    <main class="flex-1 overflow-x-auto p-2">
        
        <div id="status-msg" class="text-center text-xs text-slate-400 my-2">
            <span class="spinner mr-1"></span> Fetching Live Market Data...
        </div>

        <div class="bg-darkCard border border-slate-700 rounded-lg overflow-hidden shadow-lg w-full min-w-[340px]">
            <table class="w-full text-center border-collapse text-[10px] sm:text-xs">
                
                <thead class="bg-slate-800 text-slate-300 sticky top-0 z-10 shadow-md">
                    <tr>
                        <th colspan="3" class="p-1.5 border-b border-r border-slate-700 text-success font-black bg-success/10">CALLS (CE)</th>
                        <th class="p-1.5 border-b border-slate-700 bg-slate-900 font-black">STRIKE</th>
                        <th colspan="3" class="p-1.5 border-b border-l border-slate-700 text-danger font-black bg-danger/10">PUTS (PE)</th>
                    </tr>
                    <tr class="text-slate-400 bg-slate-800/80 uppercase tracking-wider">
                        <th class="p-1 border-b border-r border-slate-700 w-[12%]">OI</th>
                        <th class="p-1 border-b border-r border-slate-700 w-[12%]">Chng</th>
                        <th class="p-1 border-b border-r border-slate-700 w-[15%]">LTP</th>
                        
                        <th class="p-1 border-b border-slate-700 bg-slate-900 w-[22%]">PRICE</th>
                        
                        <th class="p-1 border-b border-l border-slate-700 w-[15%]">LTP</th>
                        <th class="p-1 border-b border-l border-slate-700 w-[12%]">Chng</th>
                        <th class="p-1 border-b border-l border-slate-700 w-[12%]">OI</th>
                    </tr>
                </thead>

                <tbody id="chain-body" class="text-slate-200">
                    <tr><td colspan="7" class="p-4 text-slate-500">Waiting for data...</td></tr>
                </tbody>

            </table>
        </div>
        <div class="h-10"></div> </main>

    <script>
        const API_BASE_URL = "https://algosaas.onrender.com/api/v1";
        let refreshInterval = null;

        // Number format: 1.5 L, 2.3 Cr
        function formatOI(num) {
            if (!num) return "0";
            let val = Math.abs(num);
            if (val >= 10000000) return (num / 10000000).toFixed(2) + "Cr";
            if (val >= 100000) return (num / 100000).toFixed(1) + "L";
            return num.toLocaleString();
        }

        // Color coding for Chng (Green for positive, Red for negative)
        function formatChng(num) {
            if (!num || num === 0) return `<span class="text-slate-500">0</span>`;
            if (num > 0) return `<span class="text-success">+${num}</span>`;
            return `<span class="text-danger">${num}</span>`;
        }

        async function fetchOptionChain() {
            const token = localStorage.getItem('saas_token');
            const indexName = document.getElementById('index-select').value;
            const statusMsg = document.getElementById('status-msg');
            const indicator = document.getElementById('live-indicator');
            
            if (!token) {
                window.location.href = 'index.html';
                return;
            }

            statusMsg.innerHTML = '<span class="spinner mr-1"></span> Refreshing...';
            indicator.classList.add('hidden');

            try {
                // Backend endpoint jo hum abhi banayenge
                const response = await fetch(`${API_BASE_URL}/market/option-chain?index=${indexName}`, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if(response.ok) {
                    const data = await response.json();
                    renderTable(data);
                    statusMsg.innerHTML = `✅ Last updated: ${new Date().toLocaleTimeString()}`;
                    indicator.classList.remove('hidden'); // Green dot on
                } else {
                    statusMsg.innerHTML = "❌ Failed to fetch data from broker.";
                }
            } catch (err) {
                statusMsg.innerHTML = "⚠️ Network error. Retrying...";
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('chain-body');
            tbody.innerHTML = '';

            // data = { atm: 22000, options: [ {strike: 21900, ce_ltp: 120, ce_oi: 150000, ce_chng: 5000, pe_ltp: ...}, ... ] }
            const atmStrike = data.atm;

            data.options.forEach(row => {
                const isATM = row.strike === atmStrike;
                const rowClass = isATM ? "bg-atmBg border-y-2 border-primary font-bold shadow-[inset_0_0_10px_rgba(59,130,246,0.3)]" : "border-b border-slate-700/50 hover:bg-slate-800/50";

                const tr = document.createElement('tr');
                tr.className = rowClass;

                tr.innerHTML = `
                    <td class="p-1.5 border-r border-slate-700/50 text-slate-300">${formatOI(row.ce_oi)}</td>
                    <td class="p-1.5 border-r border-slate-700/50">${formatChng(row.ce_chng)}</td>
                    <td class="p-1.5 border-r border-slate-700 text-success">${(row.ce_ltp || 0).toFixed(1)}</td>
                    
                    <td class="p-1.5 border-r border-slate-700 bg-slate-900 font-mono text-white">${row.strike}</td>
                    
                    <td class="p-1.5 border-l border-slate-700 text-danger">${(row.pe_ltp || 0).toFixed(1)}</td>
                    <td class="p-1.5 border-l border-slate-700/50">${formatChng(row.pe_chng)}</td>
                    <td class="p-1.5 border-l border-slate-700/50 text-slate-300">${formatOI(row.pe_oi)}</td>
                `;
                tbody.appendChild(tr);
            });

            // Agar ATM row hai, toh screen ko wahan thoda scroll karwa do (Mobile UX ke liye)
            const atmElement = document.querySelector('.bg-atmBg');
            if(atmElement && !window.scrolledToAtm) {
                atmElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                window.scrolledToAtm = true; // Ek hi baar auto-scroll ho
            }
        }

        // Jab page load ho, data mangwao aur har 5 second mein update karo
        window.onload = () => {
            fetchOptionChain();
            refreshInterval = setInterval(fetchOptionChain, 5000); // Har 5 second mein refresh
        };

        // Page se bahar jane par timer band kar do
        window.onbeforeunload = () => {
            if(refreshInterval) clearInterval(refreshInterval);
        };
    </script>
</body>
</html>
