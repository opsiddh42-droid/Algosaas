<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Terminal | AlgoSaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { darkBase: '#0f172a', darkCard: '#1e293b', primary: '#3b82f6', success: '#10b981', danger: '#ef4444' } } }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; overflow: hidden; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        /* Panel ab poori screen lega header/tabs ke baad */
        .panel-area { height: calc(100vh - 110px); overflow-y: auto; padding-bottom: 20px;}
        .modal-overlay { background: rgba(0,0,0,0.6); backdrop-filter: blur(2px); }
    </style>
</head>
<body class="h-screen flex flex-col">

    <header class="bg-darkCard border-b border-slate-700 p-3 flex items-center justify-between shadow-md z-10">
        <div class="flex items-center gap-3">
            <button onclick="window.location.href='index.html'" class="bg-slate-800 text-slate-300 w-8 h-8 rounded-full flex items-center justify-center border border-slate-600 hover:bg-slate-700 font-bold transition">&larr;</button>
            <div class="flex flex-col">
                <h2 class="text-sm font-bold text-white flex items-center gap-2">
                    ⚡ Terminal
                    <span id="mode-badge" class="px-2 py-0.5 text-[8px] bg-orange-500 text-white rounded font-black tracking-wider uppercase">PAPER</span>
                </h2>
                <select id="chart-index" onchange="changeSymbol()" class="bg-transparent text-xs text-slate-400 font-bold outline-none cursor-pointer mt-0.5">
                    <option value="NIFTY">NIFTY 50</option>
                    <option value="BANKNIFTY">BANKNIFTY</option>
                    <option value="SENSEX">SENSEX</option>
                </select>
            </div>
        </div>
        
        <div class="text-right bg-slate-900 border border-slate-700 px-3 py-1 rounded-lg">
            <p class="text-[9px] text-slate-500 font-bold uppercase mb-0.5">Total MTM</p>
            <p id="total-pnl" class="text-lg font-black text-slate-300">+ ₹0.00</p>
        </div>
    </header>

    <div class="flex bg-darkCard border-b border-slate-700">
        <button onclick="switchTab('chain')" id="tab-chain" class="flex-1 py-3 text-xs font-bold text-primary border-b-2 border-primary transition">Option Chain</button>
        <button onclick="switchTab('positions')" id="tab-positions" class="flex-1 py-3 text-xs font-bold text-slate-400 border-b-2 border-transparent transition">Positions</button>
    </div>

    <section id="panel-chain" class="panel-area bg-darkBase p-2">
        <div class="flex justify-between items-center mb-2 px-1">
            <span class="text-xs text-slate-400 font-bold" id="expiry-display">Loading...</span>
            <button onclick="fetchOptionChain()" class="text-xs text-primary hover:text-white transition">&#x21bb; Refresh</button>
        </div>
        
        <div class="grid grid-cols-3 text-[10px] text-slate-500 font-black uppercase tracking-wider mb-2 px-1 text-center bg-darkCard py-2 rounded">
            <div>CALL (CE)</div>
            <div>STRIKE</div>
            <div>PUT (PE)</div>
        </div>

        <div id="chain-container" class="space-y-1">
            <div class="text-center text-xs text-slate-500 py-4">Fetching live chain...</div>
        </div>
    </section>

    <section id="panel-positions" class="panel-area bg-darkBase p-2 hidden">
        <div class="flex justify-between items-center mb-2 px-1">
            <h3 class="text-xs font-bold text-slate-400 uppercase flex items-center gap-2">
                Open Positions <span class="w-2 h-2 bg-success rounded-full animate-pulse"></span>
            </h3>
            <button onclick="panicExitAll()" class="text-[10px] font-black bg-danger text-white px-2 py-1 rounded shadow-[0_0_8px_rgba(239,68,68,0.6)] hover:bg-red-600 transition">🚨 EXIT ALL</button>
        </div>
        <div id="trades-container" class="space-y-2 pb-6"></div>
    </section>

    <div id="order-modal" class="hidden fixed inset-0 z-50 modal-overlay flex items-end justify-center sm:items-center">
        <div class="bg-darkCard border-t sm:border border-slate-600 sm:rounded-xl rounded-t-2xl p-5 w-full max-w-sm shadow-2xl animate-[slideUp_0.2s_ease-out]">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-bold text-white flex items-center gap-2">⚡ Place Order</h3>
                <button onclick="closeOrderModal()" class="text-slate-400 hover:text-white font-bold text-lg">&times;</button>
            </div>
            
            <div class="mb-4 bg-slate-900 p-2 rounded border border-slate-700 flex justify-between items-center">
                <div>
                    <p class="text-[10px] text-slate-400">Selected Option</p>
                    <p class="text-sm font-black text-white" id="modal-symbol">-</p>
                </div>
                <div class="text-right">
                    <p class="text-[10px] text-slate-400">Live Price</p>
                    <p class="text-sm text-primary font-bold">₹<span id="modal-ltp">0.00</span></p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-3">
                <div>
                    <label class="text-[10px] text-slate-400 block mb-1">Quantity (Lots)</label>
                    <input type="number" id="modal-qty" class="w-full bg-slate-800 border border-slate-600 text-white rounded px-2 py-1.5 text-sm outline-none focus:border-primary">
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 block mb-1">Entry Price</label>
                    <input type="number" id="modal-price" class="w-full bg-slate-800 border border-slate-600 text-white rounded px-2 py-1.5 text-sm outline-none focus:border-primary">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-5">
                <div>
                    <label class="text-[10px] text-slate-400 block mb-1">Stoploss (₹)</label>
                    <input type="number" id="modal-sl" placeholder="0" class="w-full bg-slate-800 border border-slate-600 text-white rounded px-2 py-1.5 text-sm outline-none focus:border-danger">
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 block mb-1">Target (₹)</label>
                    <input type="number" id="modal-target" placeholder="0" class="w-full bg-slate-800 border border-slate-600 text-white rounded px-2 py-1.5 text-sm outline-none focus:border-success">
                </div>
            </div>

            <div class="flex gap-2">
                <button onclick="executeOrder('B')" class="flex-1 bg-success hover:bg-green-600 text-white font-bold py-3 rounded shadow-[0_0_10px_rgba(16,185,129,0.4)] transition uppercase text-xs">BUY</button>
                <button onclick="executeOrder('S')" class="flex-1 bg-danger hover:bg-red-600 text-white font-bold py-3 rounded shadow-[0_0_10px_rgba(239,68,68,0.4)] transition uppercase text-xs">SELL</button>
            </div>
        </div>
    </div>

    <script>
        // 🟢 YAHAN NGROK LINK UPDATE KIYA HAI 🟢
        const API_BASE_URL = "https://82e3-3-237-9-9.ngrok-free.app/api/v1"; 
        const WS_BASE_URL = "wss://82e3-3-237-9-9.ngrok-free.app/ws/live-data";

        let wsConnection = null;
        let currentAtm = 0;
        let selectedOrder = {};

        window.onload = () => {
            const mode = localStorage.getItem('trade_mode') || 'PAPER';
            const badge = document.getElementById('mode-badge');
            if(mode === 'REAL') {
                badge.innerText = 'REAL';
                badge.className = "px-2 py-0.5 text-[8px] bg-success text-white rounded font-black tracking-wider uppercase shadow-[0_0_8px_rgba(16,185,129,0.5)]";
            }
            changeSymbol(); 
            fetchPaperTrades();
            connectWebSocket();
        };

        function switchTab(tab) {
            document.getElementById('panel-chain').classList.add('hidden');
            document.getElementById('panel-positions').classList.add('hidden');
            document.getElementById('tab-chain').className = "flex-1 py-3 text-xs font-bold text-slate-400 border-b-2 border-transparent transition";
            document.getElementById('tab-positions').className = "flex-1 py-3 text-xs font-bold text-slate-400 border-b-2 border-transparent transition";
            
            document.getElementById(`panel-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).className = "flex-1 py-3 text-xs font-bold text-primary border-b-2 border-primary transition";
            if(tab === 'positions') fetchPaperTrades();
        }

        function changeSymbol() {
            const sym = document.getElementById('chart-index').value;
            fetchOptionChain(sym);
            let defaultQty = 50;
            if(sym === 'BANKNIFTY') defaultQty = 15;
            if(sym === 'SENSEX') defaultQty = 10;
            document.getElementById('modal-qty').value = defaultQty;
        }

        async function fetchOptionChain(symName = null) {
            const container = document.getElementById('chain-container');
            const symbol = symName || document.getElementById('chart-index').value;
            const token = localStorage.getItem('saas_token');
            container.innerHTML = `<div class="text-center text-xs text-slate-500 py-4">Loading Chain...</div>`;
            
            try {
                const res = await fetch(`${API_BASE_URL}/market/option-chain?symbol=${symbol}`, { 
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const response = await res.json();
                
                if (res.ok && response.status === "success") {
                    document.getElementById('expiry-display').innerText = `Expiry: ${response.expiry} | Spot: ${response.spot_price}`;
                    currentAtm = Math.round(response.spot_price / 50) * 50;
                    renderChain(response.data, symbol, response.expiry);
                } else {
                    const errorMsg = response.detail || response.message || JSON.stringify(response);
                    container.innerHTML = `<div class="text-center text-xs text-danger py-4 font-black">❌ ERROR: <br><span class="text-slate-300 font-normal mt-2 block">${errorMsg}</span></div>`;
                }
            } catch(e) {
                container.innerHTML = `<div class="text-center text-xs text-danger py-4 font-black">❌ NETWORK ERROR: <br><span class="text-slate-300 font-normal mt-2 block">${e.message}</span></div>`;
            }
        }

        function renderChain(data, symbol, expiry) {
            const container = document.getElementById('chain-container');
            container.innerHTML = '';
            
            data.forEach(item => {
                const isAtm = Math.abs(item.strike - currentAtm) < 50;
                const bgClass = isAtm ? 'bg-slate-800 border-primary' : 'bg-darkCard border-slate-700/50';
                const ceSymbol = `${symbol}${expiry}${item.strike}CE`;
                const peSymbol = `${symbol}${expiry}${item.strike}PE`;

                const html = `
                <div class="grid grid-cols-3 items-center text-center ${bgClass} border rounded-lg py-3 px-1 shadow-sm mb-1">
                    <div class="flex flex-col items-center cursor-pointer hover:bg-slate-700/50 p-1 rounded transition" onclick="openOrderModal('${ceSymbol}', ${item.ce_ltp}, '${item.ce_token}')">
                        <span class="text-sm font-bold text-success mb-1">₹${item.ce_ltp.toFixed(2)}</span>
                        <div class="bg-slate-700 text-white text-[9px] px-3 py-1 rounded font-bold uppercase">Trade</div>
                    </div>
                    
                    <div class="text-lg font-black text-white ${isAtm ? 'text-primary' : ''}">${item.strike}</div>
                    
                    <div class="flex flex-col items-center cursor-pointer hover:bg-slate-700/50 p-1 rounded transition" onclick="openOrderModal('${peSymbol}', ${item.pe_ltp}, '${item.pe_token}')">
                        <span class="text-sm font-bold text-danger mb-1">₹${item.pe_ltp.toFixed(2)}</span>
                        <div class="bg-slate-700 text-white text-[9px] px-3 py-1 rounded font-bold uppercase">Trade</div>
                    </div>
                </div>`;
                container.innerHTML += html;
            });
        }

        function openOrderModal(symbol, ltp, token) {
            selectedOrder = { symbol, ltp, token };
            document.getElementById('modal-symbol').innerText = symbol;
            document.getElementById('modal-ltp').innerText = ltp.toFixed(2);
            document.getElementById('modal-price').value = ltp.toFixed(2);
            document.getElementById('modal-sl').value = "";
            document.getElementById('modal-target').value = "";
            document.getElementById('order-modal').classList.remove('hidden');
        }

        function closeOrderModal() { document.getElementById('order-modal').classList.add('hidden'); }

        async function executeOrder(transactionType) {
            const qty = document.getElementById('modal-qty').value;
            const price = document.getElementById('modal-price').value;
            const sl = document.getElementById('modal-sl').value || "0";
            const target = document.getElementById('modal-target').value || "0";
            const mode = localStorage.getItem('trade_mode') || 'PAPER';
            const token = localStorage.getItem('saas_token');
            
            const payload = {
                exchange_segment: selectedOrder.symbol.includes("SENSEX") ? "bse_fo" : "nse_fo",
                trading_symbol: selectedOrder.symbol, transaction_type: transactionType,
                quantity: qty.toString(), price: price.toString(), order_type: "L",
                product: "NRML", token: selectedOrder.token, stoploss: sl, target: target
            };

            try {
                const res = await fetch(`${API_BASE_URL}/trades/place-order?mode=${mode}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(payload)
                });
                if(res.ok) { closeOrderModal(); switchTab('positions'); } 
                else { const data = await res.json(); alert("Error: " + data.detail); }
            } catch(e) { alert("Order Failed."); }
        }

        async function fetchPaperTrades() {
            const token = localStorage.getItem('saas_token');
            if(!token) return;
            try {
                const response = await fetch(`${API_BASE_URL}/trades/open-positions?mode=${localStorage.getItem('trade_mode') || 'PAPER'}`, { headers: { 'Authorization': `Bearer ${token}` }});
                if(response.ok) { const data = await response.json(); renderTrades(data.positions); }
            } catch(e) {}
        }

        function renderTrades(positions) {
            const container = document.getElementById('trades-container');
            if(!positions || positions.length === 0) {
                container.innerHTML = `<div class="text-center text-xs text-slate-500 py-4">No active positions</div>`;
                updateTotalPNL(0); return;
            }
            container.innerHTML = '';
            let totalMtm = 0;
            positions.forEach(pos => {
                const pnl = pos.mtm || 0; totalMtm += pnl;
                const pnlColor = pnl >= 0 ? 'text-success' : 'text-danger';
                const posColor = pos.transaction === 'B' ? 'bg-success' : 'bg-danger';
                let slTargetHtml = pos.sl > 0 || pos.target > 0 ? `<div class="text-[9px] text-slate-500 mt-1 bg-slate-800 inline-block px-1.5 py-0.5 rounded border border-slate-700">SL: <span class="text-danger font-bold">₹${pos.sl}</span> | TGT: <span class="text-success font-bold">₹${pos.target}</span></div>` : '';

                container.innerHTML += `
                <div class="bg-darkCard border border-slate-700/50 p-3 rounded-lg flex justify-between shadow-md mb-2">
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-[10px] font-bold ${posColor} text-white px-1.5 py-0.5 rounded">${pos.transaction}</span>
                            <span class="text-xs font-bold text-white">${pos.symbol}</span>
                            <span class="text-[10px] text-slate-400">x ${pos.qty}</span>
                        </div>
                        <div class="text-[10px] text-slate-400">Avg: ₹${(pos.entry_price||0).toFixed(2)} | <span class="${pnlColor} font-bold">LTP: ₹${(pos.ltp||pos.entry_price||0).toFixed(2)}</span></div>
                        ${slTargetHtml}
                    </div>
                    <div class="text-right flex flex-col justify-between items-end">
                        <span class="text-sm font-black ${pnlColor}">₹${Math.abs(pnl).toFixed(2)}</span>
                        <button onclick="squareOff('${pos.id}')" class="mt-1 text-[9px] bg-slate-800 text-slate-300 border border-slate-600 px-3 py-1.5 hover:bg-danger hover:text-white transition rounded">SQUARE OFF</button>
                    </div>
                </div>`;
            });
            updateTotalPNL(totalMtm);
        }

        function updateTotalPNL(amount) {
            const el = document.getElementById('total-pnl');
            el.innerText = `${amount >= 0 ? '+' : '-'} ₹${Math.abs(amount).toFixed(2)}`;
            el.className = `text-lg font-black transition-colors ${amount >= 0 ? 'text-success' : 'text-danger'}`;
        }

        function connectWebSocket() {
            const token = localStorage.getItem('saas_token');
            if(!token) return;
            wsConnection = new WebSocket(`${WS_BASE_URL}?token=${token}&mode=${localStorage.getItem('trade_mode') || 'PAPER'}`);
            wsConnection.onmessage = (e) => { const data = JSON.parse(e.data); if(data.positions) renderTrades(data.positions); };
            wsConnection.onclose = () => setTimeout(connectWebSocket, 5000);
        }

        async function panicExitAll() {
            if(confirm("🚨 DANGER! Are you sure you want to SQUARE OFF ALL positions?")) {
                const token = localStorage.getItem('saas_token');
                await fetch(`${API_BASE_URL}/trades/exit-all?mode=${localStorage.getItem('trade_mode') || 'PAPER'}`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` }});
                fetchPaperTrades();
            }
        }

        async function squareOff(tradeId) {
            if(confirm("Square off this position at Market Price?")) {
                const token = localStorage.getItem('saas_token');
                await fetch(`${API_BASE_URL}/trades/close-position`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ trade_id: tradeId, mode: localStorage.getItem('trade_mode') || 'PAPER' })
                });
                fetchPaperTrades();
            }
        }
    </script>
</body>
</html>
